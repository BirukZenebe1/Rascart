AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Rascart backend on AWS Lambda + API Gateway (SAM)

Parameters:
  MongoUri:
    Type: String
    NoEcho: true
    Description: MongoDB connection string
  JwtSecretKey:
    Type: String
    NoEcho: true
    Description: JWT secret key for Flask JWT
  OpenAIApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Optional OpenAI API key
  SesFromEmail:
    Type: String
    Default: ''
    Description: Verified SES sender email address
  SesRegion:
    Type: String
    Default: 'eu-central-1'
    Description: AWS SES region
  AdminEmail:
    Type: String
    Default: ''
    Description: Admin email allowed to manage promo codes
  GoogleClientId:
    Type: String
    Default: ''
    Description: Google OAuth client id used for token audience check

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 1024
    Environment:
      Variables:
        MONGO_URI: !Ref MongoUri
        JWT_SECRET_KEY: !Ref JwtSecretKey
        OPENAI_API_KEY: !Ref OpenAIApiKey
        SES_FROM_EMAIL: !Ref SesFromEmail
        SES_REGION: !Ref SesRegion
        ADMIN_EMAIL: !Ref AdminEmail
        GOOGLE_CLIENT_ID: !Ref GoogleClientId

Resources:
  BackendApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - '*'

  BackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: lambda_handler.lambda_handler
      Architectures:
        - x86_64
      Policies:
        - AWSLambdaBasicExecutionRole
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendApi
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendApi
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiUrl:
    Description: HTTP API endpoint URL
    Value: !Sub 'https://${BackendApi}.execute-api.${AWS::Region}.amazonaws.com'
