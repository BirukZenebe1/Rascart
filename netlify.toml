[build]
  command = "cd frontend && npm install --no-audit --no-fund && npm run build"
  publish = "frontend/build"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "REACT_APP_API_BASE_URL"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "https://merkato-ai.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
